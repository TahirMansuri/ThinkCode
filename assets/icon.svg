<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#14132b"/>
      <stop offset="100%" stop-color="#0b1a24"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e5bd6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1f9d8a"/>
    </linearGradient>
    <linearGradient id="bracketLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#8e5bd6"/>
    </linearGradient>
    <linearGradient id="bracketRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="116" fill="none" stroke="url(#borderGrad)" stroke-width="12" opacity="0.85"/>

  <!-- Subtle Neural Grid / Algorithmic Circuit lines -->
  <g opacity="0.22" stroke="#8e5bd6" stroke-width="3">
    <line x1="84" y1="256" x2="428" y2="256" stroke-dasharray="8 8"/>
    <line x1="256" y1="84" x2="256" y2="428" stroke-dasharray="8 8"/>
    <circle cx="256" cy="256" r="162" fill="none" stroke-dasharray="6 6"/>
  </g>

  <!-- Left Code Bracket "<" -->
  <path d="M 188 152 L 96 256 L 188 360" 
        fill="none" 
        stroke="url(#bracketLeft)" 
        stroke-width="38" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Right Code Bracket ">" -->
  <path d="M 324 152 L 416 256 L 324 360" 
        fill="none" 
        stroke="url(#bracketRight)" 
        stroke-width="38" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Algorithmic Graph Network & Decision Flow -->
  <line x1="256" y1="168" x2="208" y2="256" stroke="#8e5bd6" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
  <line x1="256" y1="168" x2="304" y2="256" stroke="#2dd4bf" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
  <line x1="208" y1="256" x2="256" y2="344" stroke="#8e5bd6" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
  <line x1="304" y1="256" x2="256" y2="344" stroke="#2dd4bf" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
  <line x1="208" y1="256" x2="304" y2="256" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.95"/>

  <!-- Graph Vertices / Nodes -->
  <!-- Top Root Node -->
  <circle cx="256" cy="168" r="24" fill="#0a0e17" stroke="url(#nodeGrad)" stroke-width="9"/>
  <circle cx="256" cy="168" r="9" fill="#fbbf24"/>

  <!-- Left Child Node -->
  <circle cx="208" cy="256" r="22" fill="#0a0e17" stroke="url(#bracketLeft)" stroke-width="8"/>
  <circle cx="208" cy="256" r="8" fill="#c084fc"/>

  <!-- Right Child Node -->
  <circle cx="304" cy="256" r="22" fill="#0a0e17" stroke="url(#bracketRight)" stroke-width="8"/>
  <circle cx="304" cy="256" r="8" fill="#2dd4bf"/>

  <!-- Bottom Leaf Node -->
  <circle cx="256" cy="344" r="24" fill="#0a0e17" stroke="url(#coreGrad)" stroke-width="9"/>
  <circle cx="256" cy="344" r="9" fill="#38bdf8"/>

  <!-- Central Algorithmic Core Spark -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#glow)"/>
</svg>
